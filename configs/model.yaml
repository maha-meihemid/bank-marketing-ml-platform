selection_metric: roc_auc

mlflow:
  tracking_uri: sqlite:///mlflow.db
  baseline_experiment_name: bank-marketing-baselines
  tuning_experiment_name: bank-marketing-tuning
  evaluation_experiment_name: bank-marketing-final-evaluation

models:
  logistic_regression:
    max_iter: 1000
    random_state: 42

  random_forest:
    n_estimators: 150
    random_state: 42
    n_jobs: -1

  xgboost:
    n_estimators: 400
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: -1
    eval_metric: logloss
    tree_method: hist

tuning:
  xgboost:
    n_iter: 12
    cv_folds: 3
    random_state: 42
    scoring: roc_auc

    search_space:
      n_estimators:
        - 300
        - 500
        - 700
        - 900

      max_depth:
        - 3
        - 4
        - 5
        - 6
        - 8

      learning_rate:
        - 0.02
        - 0.03
        - 0.05
        - 0.08
        - 0.1

      min_child_weight:
        - 1
        - 3
        - 5
        - 8

      subsample:
        - 0.7
        - 0.8
        - 0.9
        - 1.0

      colsample_bytree:
        - 0.7
        - 0.8
        - 0.9
        - 1.0

      reg_alpha:
        - 0.0
        - 0.01
        - 0.1
        - 0.5

      reg_lambda:
        - 1.0
        - 2.0
        - 5.0
        - 10.0