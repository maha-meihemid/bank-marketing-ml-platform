selection_metric: roc_auc

mlflow:
  tracking_uri: sqlite:///mlflow.db
  baseline_experiment_name: bank-marketing-baselines
  tuning_experiment_name: bank-marketing-tuning
  evaluation_experiment_name: bank-marketing-final-evaluation

models:
  logistic_regression:
    max_iter: 1000
    random_state: 42

  random_forest:
    n_estimators: 150
    random_state: 42
    n_jobs: -1

  xgboost:
    n_estimators: 400
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    n_jobs: -1
    eval_metric: logloss
    tree_method: hist